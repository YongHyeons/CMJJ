                        <svg class="class-svg" focusable="false" aria-hidden="true" viewBox="0 0 24 24" data-testid="PostAddRoundedIcon"><path d="M18 12c-.55 0-1 .45-1 1v5.22c0 .55-.45 1-1 1H6c-.55 0-1-.45-1-1V8c0-.55.45-1 1-1h5c.55 0 1-.45 1-1s-.45-1-1-1H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-6c0-.55-.45-1-1-1zm3.02-7H19V2.98c0-.54-.44-.98-.98-.98h-.03c-.55 0-.99.44-.99.98V5h-2.01c-.54 0-.98.44-.99.98v.03c0 .55.44.99.99.99H17v2.01c0 .54.44.99.99.98h.03c.54 0 .98-.44.98-.98V7h2.02c.54 0 .98-.44.98-.98v-.04c0-.54-.44-.98-.98-.98z"></path><path d="M14 9H8c-.55 0-1 .45-1 1s.45 1 1 1h6c.55 0 1-.45 1-1s-.45-1-1-1zm0 3H8c-.55 0-1 .45-1 1s.45 1 1 1h6c.55 0 1-.45 1-1s-.45-1-1-1zm0 3H8c-.55 0-1 .45-1 1s.45 1 1 1h6c.55 0 1-.45 1-1s-.45-1-1-1z"></path></svg>

                    </div>
                </div>
                
                <div class="main-content">
                    <div class="content" id="create-class-content">
                        <div class="main-text">클래스 생성</div>
                        <div class="class-grid">
                            <div class="class-box">
                                <a href="/reg" class="create-class-btn">+</a>
                                <p>클래스 생성하기</p>
                            </div>
                            <div class="class-box-two" th:each="odc : ${odclist}">
                                <div class="class-box-top">
                                    <div class="class-box-text" th:text="${odc.title}"></div>
                                    <svg class="class-svg-two" focusable="false" aria-hidden="true" viewBox="0 0 24 24" data-testid="DeleteForeverOutlinedIcon"><path d="M14.12 10.47 12 12.59l-2.13-2.12-1.41 1.41L10.59 14l-2.12 2.12 1.41 1.41L12 15.41l2.12 2.12 1.41-1.41L13.41 14l2.12-2.12zM15.5 4l-1-1h-5l-1 1H5v2h14V4zM6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM8 9h8v10H8V9z"></path></svg>
                                </div>
                                <div class="class-box-img">
                                    <img class="box-img" th:src="@{'/'+${odc.imageAddr}+'/main.jpg'}">
                                </div>
                                <a class="continue-button" th:href="'/mod?cId='+${odc.cId}" target="_self">
                               		<div id="mod-button" th:data-cId="${odc.cId}" type="button">수정하기</div>
                               	</a>
                            </div>
                        </div>
                        
                    </div>


                    <div class="content" id="registered-class-content" style="display: none;">
                        <div class="main-text">등록 완료 클래스</div>
                        <div class="class-grid">
                            <div class="class-box-two">
                                <div class="class-box-top">
                                    <div class="class-box-text">클래스명</div>
                                    <svg class="class-svg-two" focusable="false" aria-hidden="true" viewBox="0 0 24 24" data-testid="DeleteForeverOutlinedIcon"><path d="M14.12 10.47 12 12.59l-2.13-2.12-1.41 1.41L10.59 14l-2.12 2.12 1.41 1.41L12 15.41l2.12 2.12 1.41-1.41L13.41 14l2.12-2.12zM15.5 4l-1-1h-5l-1 1H5v2h14V4zM6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM8 9h8v10H8V9z"></path></svg>
